<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WK App Live Pro</title>

<style>
body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#06142e,#0b1d3a);
color:white;
}

header{
text-align:center;
padding:20px;
font-size:26px;
font-weight:bold;
}

#clock{
text-align:center;
padding:10px;
font-size:16px;
}

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

button{
background:#1e90ff;
border:none;
color:white;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

button:hover{
opacity:0.9;
}

.container{
padding:15px;
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.08);
padding:12px;
margin-top:10px;
border-radius:10px;
border-left:4px solid #1e90ff;
}

.live{
border-left:4px solid red;
}
</style>

</head>

<body>

<header>🏆 WK LIVE PRO</header>

<div id="clock"></div>

<div class="menu">
<button onclick="home()">🏠 Home</button>
<button onclick="wedstrijden()">⚽ Wedstrijden</button>
<button onclick="spelers()">👥 Spelers</button>
<button onclick="stadions()">🏟 Stadions</button>
</div>

<div class="container">
<div id="content"></div>
</div>

<script>

// CLOCK
function updateClock(){
document.getElementById("clock").innerHTML =
"🕒 België: " + new Date().toLocaleTimeString("nl-BE");
}
setInterval(updateClock,1000);
updateClock();

// HOME
function home(){
document.getElementById("content").innerHTML=`
<div class="card">
Welkom bij WK Live Pro ⚽
</div>
<div class="card">
Klik op Wedstrijden voor live of WK data.
</div>
`;
}

// WEDSTRIJDEN (LIVE + FALLBACK)
function wedstrijden(){

document.getElementById("content").innerHTML =
`<div class="card">⏳ Data laden...</div>`;

fetch("https://www.thesportsdb.com/api/v1/json/3/livescore.php?s=Soccer")
.then(r=>r.json())
.then(data=>{

let html="";

if(data.events && data.events.length>0){

html += `<div class="card live"><b>🔴 LIVE WEDSTRIJDEN</b></div>`;

data.events.forEach(m=>{
html += `
<div class="card live">
⚽ <b>${m.strHomeTeam}</b> ${m.intHomeScore ?? 0} - ${m.intAwayScore ?? 0} <b>${m.strAwayTeam}</b><br>
🏟 ${m.strVenue || "Onbekend"}<br>
📍 ${m.strCity || ""}
</div>
`;
});

}else{

let wk = [
"Mexico vs Zuid-Afrika",
"Canada vs Italië",
"Brazilië vs Japan",
"Frankrijk vs Nigeria",
"Duitsland vs USA"
];

html += `<div class="card"><b>🏆 WK Schema</b></div>`;

wk.forEach(m=>{
html += `<div class="card">⚽ ${m}</div>`;
});

}

document.getElementById("content").innerHTML=html;

})
.catch(()=>{

document.getElementById("content").innerHTML=
`<div class="card">❌ Geen data beschikbaar</div>`;

});

}

// SPELERS
function spelers(){
document.getElementById("content").innerHTML=`
<div class="card">🇧🇪 De Bruyne</div>
<div class="card">🇧🇪 Lukaku</div>
<div class="card">🇫🇷 Mbappé</div>
<div class="card">🇧🇷 Vinícius</div>
`;
}

// STADIONS
function stadions(){
document.getElementById("content").innerHTML=`
<div class="card">🏟 MetLife Stadium (USA)</div>
<div class="card">🏟 Estadio Azteca (Mexico)</div>
<div class="card">🏟 BC Place (Canada)</div>
`;
}

home();

</script>

</body>
</html>
