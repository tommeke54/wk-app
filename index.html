<body>

<div class="header">
<div class="overlay">

<div class="logo">
🏆 WorldCup Live Pro
</div>

<div class="slogan">
Alle WK-informatie op één plek
</div>

<div class="flags">
🇧🇪 🇧🇷 🇫🇷 🇩🇪 🇦🇷 🇪🇸 🇳🇱 🇯🇵 🇺🇸 🇲🇽 🇨🇦
</div>

</div>
</div>

<div class="container" id="appContent"></div>

<div class="bottom-nav">

<div class="nav-btn active" onclick="showHome(this)">
<span class="nav-icon">🏠</span>
Home
</div>

<div class="nav-btn" onclick="showMatches(this)">
<span class="nav-icon">⚽</span>
Wedstrijden
</div>

<div class="nav-btn" onclick="showTeams(this)">
<span class="nav-icon">👥</span>
Teams
</div>

<div class="nav-btn" onclick="showStadiums(this)">
<span class="nav-icon">🏟</span>
Stadions
</div>

<div class="nav-btn" onclick="showStandings(this)">
<span class="nav-icon">📊</span>
Standen
</div>

</div>

<script>

function setActive(btn){
document.querySelectorAll('.nav-btn').forEach(b=>{
b.classList.remove('active');
});
btn.classList.add('active');
}

function renderHome(){

document.getElementById("appContent").innerHTML = `

<div class="card">
<div class="card-title">⚽ Volgende wedstrijd</div>

<div class="match">
België 🇧🇪 vs Frankrijk 🇫🇷
</div>

<div>
20 juni 2026 - 21:00
</div>

</div>

<div class="card">
<div class="card-title">⏳ Countdown</div>

<div class="countdown" id="countdown">
Laden...
</div>

</div>

<div class="card">
<div class="card-title">⭐ Favoriet team</div>
België 🇧🇪
</div>

<div class="card">
<div class="card-title">📰 Laatste WK Nieuws</div>

<div class="news">
• WK voorbereiding volop bezig<br>
• Nieuwe stadions klaar voor gebruik<br>
• Favorieten voor de wereldtitel bekend
</div>

</div>
`;

startCountdown();

}

function startCountdown(){

const targetDate =
new Date("June 20, 2026 21:00:00").getTime();

const timer = setInterval(()=>{

const now = new Date().getTime();
const distance = targetDate - now;

if(distance < 0){
clearInterval(timer);
return;
}

const days =
Math.floor(distance / (1000*60*60*24));

const hours =
Math.floor((distance % (1000*60*60*24))
/ (1000*60*60));

const minutes =
Math.floor((distance % (1000*60*60))
/ (1000*60));

const el = document.getElementById("countdown");

if(el){
el.innerHTML =
days + "d " +
hours + "u " +
minutes + "m";
}

},1000);

}

function showHome(btn){
setActive(btn);
renderHome();
}

function showMatches(btn){

setActive(btn);

document.getElementById("appContent").innerHTML = `

</div>

`;

}

<div class="card">

`;

}

</script>
