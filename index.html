<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WK App Pro Live</title>

<style>
body{
font-family: Arial;
margin:0;
background: linear-gradient(135deg,#06142e,#0b1d3a);
color:white;
}

header{
text-align:center;
padding:20px;
font-size:26px;
font-weight:bold;
}

#clock{
text-align:center;
padding:10px;
font-size:16px;
}

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

button{
background:#1e90ff;
border:none;
color:white;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

button:hover{
opacity:0.9;
}

.container{
padding:15px;
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.08);
padding:12px;
margin-top:10px;
border-radius:10px;
border-left:4px solid #1e90ff;
}
</style>

</head>

<body>

<header>🏆 WK APP PRO LIVE</header>

<div id="clock"></div>

<div class="menu">
<button onclick="home()">🏠 Home</button>
<button onclick="wedstrijden()">⚽ Wedstrijden</button>
<button onclick="spelers()">👥 Spelers</button>
<button onclick="stadions()">🏟 Stadions</button>
</div>

<div class="container">
<div id="content"></div>
</div>

<script>

function updateClock(){
document.getElementById("clock").innerHTML =
"🕒 België: " + new Date().toLocaleTimeString("nl-BE");
}
setInterval(updateClock,1000);
updateClock();

function home(){
document.getElementById("content").innerHTML=`
<div class="card">
Welkom bij je LIVE WK App ⚽
</div>
<div class="card">
Klik op Wedstrijden om live data te laden.
</div>
`;
}

function wedstrijden(){

document.getElementById("content").innerHTML=
`<div class="card">⏳ Live data laden...</div>`;

fetch("https://www.thesportsdb.com/api/v1/json/3/livescore.php?s=Soccer")
.then(r=>r.json())
.then(data=>{

if(!data.events){
document.getElementById("content").innerHTML=
`<div class="card">Geen live wedstrijden op dit moment.</div>`;
return;
}

let html="";

data.events.forEach(m=>{
html += `
<div class="card">
⚽ <b>${m.strHomeTeam}</b> ${m.intHomeScore ?? 0} - ${m.intAwayScore ?? 0} <b>${m.strAwayTeam}</b><br>
🏟 ${m.strVenue || "Onbekend"}<br>
📍 ${m.strCity || ""}
</div>
`;
});

document.getElementById("content").innerHTML=html;

})
.catch(()=>{

document.getElementById("content").innerHTML=
`<div class="card">❌ Fout bij laden van data</div>`;

});

}

function spelers(){
document.getElementById("content").innerHTML=`
<div class="card">🇧🇪 De Bruyne - Middenvelder</div>
<div class="card">🇧🇪 Lukaku - Aanvaller</div>
<div class="card">🇫🇷 Mbappé - Aanvaller</div>
`;
}

function stadions(){
document.getElementById("content").innerHTML=`
<div class="card">🏟 Maracanã - Brazilië</div>
<div class="card">🏟 Wembley - Engeland</div>
<div class="card">🏟 Bernabéu - Spanje</div>
`;
}

home();

</script>

</body>
</html>
