<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WK App Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#06142e,#0b1d3a);
color:white;
min-height:100vh;
}

header{
background:rgba(0,0,0,0.25);
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

#clock{
text-align:center;
padding:10px;
font-size:18px;
}

.menu{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:15px;
}

button{
background:#1e90ff;
border:none;
color:white;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:.9;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:12px;
margin-bottom:15px;
border-left:4px solid #1e90ff;
}

.title{
font-size:22px;
margin-bottom:10px;
}
</style>

</head>

<body>

<header>🏆 WK APP PRO</header>

<div id="clock"></div>

<div class="menu">
<button onclick="home()">🏠 Home</button>
<button onclick="wedstrijden()">⚽ Wedstrijden</button>
<button onclick="spelers()">👥 Spelers</button>
<button onclick="stadions()">🏟 Stadions</button>
<button onclick="favoriet()">⭐ Favoriet</button>
</div>

<div class="container">
<div id="content"></div>
</div>

<script>

let favorietePloeg = "België";

function updateClock(){
const now = new Date();
document.getElementById("clock").innerHTML =
"🕒 België: " + now.toLocaleTimeString("nl-BE");
}

setInterval(updateClock,1000);
updateClock();

function home(){
document.getElementById("content").innerHTML = `
<div class="card">
<div class="title">Welkom</div>
Welkom bij jouw professionele WK-app.
</div>

<div class="card">
⭐ Favoriete ploeg: ${favorietePloeg}
</div>
`;
}

function wedstrijden(){
document.getElementById("content").innerHTML = `
<div class="card">
🇧🇪 België vs Frankrijk<br>
⏰ 18:00<br>
🏟 Koning Boudewijnstadion
</div>

<div class="card">
🇧🇷 Brazilië vs Argentinië<br>
⏰ 21:00<br>
🏟 Maracanã
</div>
`;
}

function spelers(){
document.getElementById("content").innerHTML = `
<div class="card">
🇧🇪 Kevin De Bruyne - Middenvelder
</div>

<div class="card">
🇧🇪 Romelu Lukaku - Aanvaller
</div>

<div class="card">
🇫🇷 Kylian Mbappé - Aanvaller
</div>
`;
}

function stadions(){
document.getElementById("content").innerHTML = `
<div class="card">
🏟 Koning Boudewijnstadion<br>
📍 Brussel
</div>

<div class="card">
🏟 Maracanã<br>
📍 Rio de Janeiro
</div>
`;
}

function favoriet(){
const ploeg = prompt("Welke ploeg is jouw favoriet?");
if(ploeg){
favorietePloeg = ploeg;
home();
}
}

home();

</script>

</body>
</html>
