<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WK Super App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e90ff">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#06142e,#0b1d3a);
color:white;
}

header{
text-align:center;
padding:20px;
font-size:26px;
font-weight:bold;
}

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

button{
background:#1e90ff;
border:none;
color:white;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
}

button:active{
transform:scale(0.95);
}

.container{
padding:15px;
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.08);
padding:12px;
margin-top:10px;
border-radius:10px;
border-left:4px solid #1e90ff;
}

.live{
border-left:4px solid red;
}
</style>

</head>

<body>

<header>🏆 WK SUPER APP</header>

<div class="menu">
<button onclick="home()">🏠 Home</button>
<button onclick="wedstrijden()">⚽ Wedstrijden</button>
<button onclick="spelers()">👥 Spelers</button>
<button onclick="stadions()">🏟 Stadions</button>
</div>

<div class="container">
<div id="content"></div>
</div>

<script>

let fav = localStorage.getItem("fav") || "geen";

function home(){
document.getElementById("content").innerHTML=`
<div class="card">
Welkom 👋
</div>

<div class="card">
⭐ Favoriet: ${fav}
</div>
`;
}

function wedstrijden(){

document.getElementById("content").innerHTML =
`<div class="card">⏳ Laden...</div>`;

fetch("https://www.thesportsdb.com/api/v1/json/3/livescore.php?s=Soccer")
.then(r=>r.json())
.then(data=>{

let html="";

if(data.events){

html += `<div class="card live"><b>🔴 LIVE</b></div>`;

data.events.forEach(m=>{
html += `
<div class="card live">
⚽ ${m.strHomeTeam} ${m.intHomeScore ?? 0} - ${m.intAwayScore ?? 0} ${m.strAwayTeam}<br>
🏟 ${m.strVenue || "Onbekend"}
</div>
`;
});

}else{

html += `<div class="card">Geen live wedstrijden</div>`;

}

document.getElementById("content").innerHTML=html;

});
}

function spelers(){

document.getElementById("content").innerHTML=`
<div class="card">
<button onclick="setFav('België')">België</button>
<button onclick="setFav('Frankrijk')">Frankrijk</button>
<button onclick="setFav('Brazilië')">Brazilië</button>
</div>

<div class="card">
⭐ Favoriet: ${fav}
</div>
`;
}

function setFav(team){
localStorage.setItem("fav", team);
fav = team;
alert("⭐ opgeslagen: " + team);
home();
}

function stadions(){
document.getElementById("content").innerHTML=`
<div class="card">🏟 MetLife Stadium</div>
<div class="card">🏟 Maracanã</div>
<div class="card">🏟 Wembley</div>
`;
}

home();

</script>

</body>
</html>
